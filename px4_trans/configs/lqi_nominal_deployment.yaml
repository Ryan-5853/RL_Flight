schema_version: 1

# Numerical plant and 4x13 LQI source. Paths are relative to the repository root.
simulator_config: SimEnv/configs/sim2real_micro_coaxial_gain_robust.yaml
controller_config: Controller/configs/lqi_sim2real_micro_coaxial_4out.yaml

# PX4 manual-control reference contract. The stick-to-command ratio was raised
# relative to the original virtual-pilot envelope (roll/pitch 12 deg -> 18 deg,
# yaw 1.2 -> 1.5 rad/s) so manual inputs command more attitude per stick
# deflection.
manual_reference:
  roll:
    limit_rad: 0.3141593
    time_constant_s: 0.18
  pitch:
    limit_rad: 0.3141593
    time_constant_s: 0.18
  yaw:
    limit_rad_s: 1.5
    time_constant_s: 0.25
