schema_version: 1

simulator_config: ../../SimEnv/configs/sim2real_micro_coaxial.yaml
controller_config: ../../Controller/configs/lqi_sim2real_micro_coaxial_4out.yaml

run:
  seed: 20260807
  device: cuda:0
  dtype: float32
  # Safe starting point for an 8 GiB GPU. Override downward if the simulator
  # and desktop compositor together leave less than about 7 GiB free.
  parallel_count: 1024
  output_directory: ../datasets/lqi_gru_dagger_4out_external_pilot_v1

observation:
  measurement_mode: simulated_sensors

sampling:
  parameterization: sim2real_micro
  # 4096 keeps the full in-memory training set within the current 15 GiB host
  # RAM. DAgger then adds targeted on-policy coverage.
  parameter_groups: 4096
  initial_conditions_per_group: 4
  episode_duration_s: 6.0
  sim2real_ranges:
    # Core training domain. T/W 1.0-1.15 is retained for a separate boundary
    # audit instead of allowing nearly uncontrollable cases to dominate BC.
    mass_kg: [0.425, 1.848]
    inertia_xy_radius_of_gyration_m: [0.035, 0.075]
    inertia_z_radius_of_gyration_m: [0.045, 0.080]
    thrust_to_weight: [1.15, 5.0]
    motor_reaction_scale: [0.25, 4.0]
    motor_reaction_ratio: [0.70, 1.40]
    motor_time_constant_s: [0.015, 0.120]
    direct_center_xy_radius_m: [0.00001, 0.010]
    direct_center_z_m: [-0.05, 0.05]
    direct_thrust_fraction: [0.50, 0.80]
    grid_radius_m: [0.040, 0.060]
    grid_azimuth_error_rad: [-0.1396263, 0.1396263]
    grid_center_z_m: [0.02, 0.08]
    grid_effectiveness_scale: [0.50, 1.50]
    servo_time_constant_s: [0.010, 0.080]
    servo_max_speed_rad_s: [5.0, 11.6355]
    coupling_attenuation: [0.0, 0.40]
  feasibility:
    maximum_linear_trim_servo_angle_rad: 0.125
    maximum_linear_trim_residual_rad_s2: 0.10

initial_state:
  sampling_design: stratified_multiaxis
  minimum_tilt_rad: 0.0
  maximum_tilt_rad: 0.3490659
  maximum_angular_rate_rad_s: [1.25, 1.25, 1.75]

convergence:
  maximum_roll_pitch_error_rad: 0.0349066
  maximum_angular_rate_rad_s: 0.10
  hold_s: 0.5
  safety_tilt_rad: 1.0471976
  safety_angular_rate_rad_s: 10.0

window:
  length_s: 6.0
  stride_s: 6.0
  maximum_start_s: 0.0
  split_fractions: [0.70, 0.15, 0.15]

command_source:
  type: flight_train.commands:VirtualPilotCommandSource
  version: "2"
  seed: 20260808
  params:
    throttle:
      minimum: 0.25
      maximum: 0.90
      spool:
        duration_s: 0.15
        target_range: [0.38, 0.68]
      # This is only the base external-pilot model. Per-episode capability is
      # randomized by external_pilot.profiles below.
      height_controller:
        observation_source: truth
        target_m: 0.0
        initial_throttle_range: [0.36, 0.70]
        proportional_gain: 0.06
        integral_gain: 0.03
        error_limit_m: 5.0
      slew_rate:
        rise_per_s: 1.2
        fall_per_s: 0.9
    sticks:
      roll:  {mode: angle, limit_rad: 0.2094395, time_constant_s: 0.18}
      pitch: {mode: angle, limit_rad: 0.2094395, time_constant_s: 0.18}
      yaw:   {mode: rate, limit_rad_s: 1.2, time_constant_s: 0.25}
      target_sampling:
        distribution: centered
        center_exponent: 1.5
        hold_duration_s:
          range: [0.50, 2.00]
      reset:
        filtered_stick: zero
        initial_target_scale: 1.0

# The upper rotor is external to every LQI/GRU variant. These profiles model
# pilot skill as a distribution instead of assuming ideal PID altitude hold.
external_pilot:
  profiles:
    - name: skilled
      weight: 0.20
      mode: feedback
      feedback_gain_scale: [0.85, 1.15]
      reaction_delay_s: [0.01, 0.06]
      update_period_s: [0.01, 0.04]
      height_bias_m: [-0.03, 0.03]
      height_noise_std_m: [0.00, 0.02]
      lapse_probability: [0.00, 0.01]
    - name: average
      weight: 0.35
      mode: feedback
      feedback_gain_scale: [0.50, 0.95]
      reaction_delay_s: [0.05, 0.16]
      update_period_s: [0.04, 0.12]
      height_bias_m: [-0.12, 0.12]
      height_noise_std_m: [0.01, 0.06]
      lapse_probability: [0.00, 0.06]
    - name: poor
      weight: 0.30
      mode: feedback
      feedback_gain_scale: [0.15, 0.65]
      reaction_delay_s: [0.12, 0.35]
      update_period_s: [0.10, 0.25]
      height_bias_m: [-0.30, 0.30]
      height_noise_std_m: [0.04, 0.15]
      lapse_probability: [0.05, 0.20]
    - name: manual
      weight: 0.15
      mode: manual_sample_hold
      manual_throttle_range: [0.30, 0.84]
      manual_hold_s: [0.40, 1.80]
      reaction_delay_s: [0.08, 0.30]
      update_period_s: [0.08, 0.25]

distillation:
  schema_version: 1
  control_hz: 500
  dataset_stride_steps: 1
  # 256 groups x 4 initial conditions = 1024 parallel episodes. The measured
  # RTX 4060 memory use at 512 episodes remained close to 1.2 GiB total.
  shard_parameter_groups: 256
  student_observation:
    attitude_source: estimator_contract
    fields:
      - attitude_q_tilt_estimate
      - gyro
      - accelerometer
      - motor_speed
      - target_attitude_q_tilt
      - target_angular_velocity_b
      - collective_command
      - previous_actuator_command
    explicitly_forbidden:
      - physical_parameter_labels
      - lqi_gain
      - truth_servo_angle
      - truth_angular_acceleration
      - truth_force_or_moment
  training:
    arch: gru
    hidden_size: 128
    recurrent_layers: 2
    head_sizes: [128, 64]
    dropout: 0.10
    batch_size: 8
    tbptt_steps: 512
    epochs: 40
    learning_rate: 0.0003
    command_delta_loss_weight: 0.20
    hidden_probe_ridge: 0.001
    previous_command_noise_std: 0.05
    previous_command_reset_prob: 0.05

dagger:
  schema_version: 1
  iterations: 6
  train_groups_per_iteration: 64
  validation_groups_per_iteration: 0
  trials_per_group: 4
  training_epochs: 30
  gate_trials_per_group: 4
  gate_duration_s: 6.0
  gate_validation_groups: 24
  arch: gru
  context_steps: null
  exclude_previous_command: false
  previous_command_noise_std: 0.05
  previous_command_reset_prob: 0.05
