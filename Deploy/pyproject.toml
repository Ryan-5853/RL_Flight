[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-flight-deploy"
version = "0.1.0"
description = "Checkpoint optimization, packaging, and low-latency inference runtime"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.12.1",
]

[project.scripts]
flight-deploy = "flight_deploy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
