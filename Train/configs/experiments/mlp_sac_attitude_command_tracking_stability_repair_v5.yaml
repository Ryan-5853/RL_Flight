# Tracking-gated cyclic movement repair of the v4 final policy.
#
# v4 reduced cyclic actuator motion in every fixed scenario, but its global
# movement penalty also caused a small roll/pitch and yaw tracking regression.
# This run keeps a stronger steady-state movement objective while smoothly
# reducing that objective whenever tracking error needs corrective authority.
#
# Gate definition:
#   gate = minimum + (1 - minimum) * exp(
#       -0.5 * (roll_pitch_error / roll_pitch_scale)^2
#       -0.5 * (yaw_rate_error / yaw_rate_scale)^2
#   )
#
# At zero tracking error the full cyclic movement weight is active. At large
# error only the configured minimum remains. The scales equal the curriculum
# quality limits, so command transients are protected without adding hidden
# filter state or changing the policy observation contract.
#
# Launch:
#   flight-train run \
#     --config configs/experiments/mlp_sac_attitude_command_tracking_stability_repair_v5.yaml
#
# Selection note:
#   Keep and compare late periodic checkpoints using cyclic total variation,
#   0.5--2 Hz cyclic action RMS, and tracking RMSE. best_total remains a
#   tracking-led selector and is not guaranteed to be the smoothest policy.

schema_version: 2

experiment:
  name: mlp_sac_attitude_command_tracking_stability_repair_v5
  entrypoint:
    type: "flight_train.runner:run_experiment"
    version: "train-framework-v1"

seed:
  base: 20260807
  deterministic_algorithms: true
  cudnn_benchmark: false

run:
  device: cuda:0
  dtype: float32
  parallel_count: 512
  # 96 rollouts x 512 environments x 256 control steps.
  total_control_steps: 12582912
  output_root: ../../runs
  allow_unimplemented_simulator: false

environment:
  factory: "simenv:SimulationEnvironment"
  config_path: ../environment/gru_sac_upright_height_only_small_tip.yaml
  observation_source: truth

command_source:
  type: "flight_train.commands:VirtualPilotCommandSource"
  version: "2"
  seed: 52037
  params:
    throttle:
      minimum: 0.20
      maximum: 0.85
      spool:
        duration_s: 0.10
        target_range: [0.54, 0.58]
      height_controller:
        observation_source: truth
        target_m: 0.0
        initial_throttle_range: [0.55, 0.58]
        proportional_gain: 0.08
        integral_gain: 0.04
        error_limit_m: 5.0
      slew_rate:
        rise_per_s: 4.0
        fall_per_s: 0.35
    sticks:
      roll:  {mode: angle, limit_rad: 0.10, time_constant_s: 0.20}
      pitch: {mode: angle, limit_rad: 0.10, time_constant_s: 0.20}
      yaw:   {mode: rate, limit_rad_s: 0.35, time_constant_s: 0.30}
      target_sampling:
        distribution: centered
        center_exponent: 2.0
        hold_duration_s:
          range: [8.0, 12.0]
      reset:
        filtered_stick: zero
        initial_target_scale: 0.0

control_contract:
  version: self_stabilize_v1
  observation_profile: attitude_self_stabilize_21d_v3
  observation_history:
    mode: uniform
    frames: 61
    stride_steps: 1
  action_transform:
    type: residual_around_trim
    trim_command: [0.53523, 0.0, 0.0, 0.0]
    residual_scale: [0.30, 1.0, 1.0, 1.0]
  policy_action:
    fields: [lower_motor, servo_1, servo_2, servo_3]
  external_action:
    fields: [upper_motor]
  simulator_command:
    fields: [upper_motor, lower_motor, servo_1, servo_2, servo_3]

randomization:
  static:
    seed: 32037
    scope: episode
    parameters: {}
  dynamic:
    seed: 42037
    scope: simulator
    parameters: {}

task:
  episode_duration_s: 30.0
  episode_curriculum:
    durations_s:   [10.0, 20.0, 30.0]
    target_scales: [0.10, 0.25, 0.50]
    success_fraction: 0.80
    evaluation_episodes_per_env: 1.0
    consecutive_passes: 2
    quality_gate:
      max_roll_pitch_rmse_rad: 0.04363323129985824
      max_yaw_rate_rmse_rad_s: 0.12
      max_angular_rate_rms_rad_s: 0.20
  termination:
    max_tilt_rad: 1.0
    max_angular_rate_rad_s: 8.0
    angular_rate_axes: roll_pitch

reward:
  calculator:
    type: "flight_train.rewards.attitude:AttitudeRewardCalculator"
    version: "3"
    params:
      roll_pitch_weight: 0.0
      tilt_weight: 0.0
      yaw_rate_weight: 0.0

      joint_tracking_weight: 0.004
      joint_tracking_mean_weight: 0.001
      joint_roll_pitch_scale_rad: 0.04363323129985824
      joint_yaw_rate_scale_rad_s: 0.12
      joint_tracking_huber_delta: 1.0

      angular_rate_weight: 0.00015625
      action_rate_weight: 0.0
      servo_cyclic_weight: 0.0

      motor_movement_weight: 0.0
      servo_common_movement_weight: 0.0
      # Stronger than v4 only when tracking is already accurate. Around the v4
      # hover error distribution, the gate keeps the effective weight near v4.
      servo_cyclic_movement_weight: 0.010
      servo_cyclic_movement_gate_roll_pitch_scale_rad: 0.04363323129985824
      servo_cyclic_movement_gate_yaw_rate_scale_rad_s: 0.12
      servo_cyclic_movement_gate_minimum: 0.15

      saturation_weight: 0.01
      alive_bonus: 0.005
      survival_progress_weight: 0.0

      tilt_barrier_weight: 0.01
      rate_barrier_weight: 0.001
      barrier_start_fraction: 0.50
      barrier_exponent: 2.0

      termination_penalty: 10.0
      early_termination_penalty: 10.0
  context:
    fields:
      - {name: attitude_geodesic_rad, source: task}
      - {name: angular_velocity_b, source: truth}
      - {name: static_domain, source: train_randomizer, visibility: reward_only}

model:
  type: mlp_actor_critic
  hidden_sizes: [256, 256]
  policy_distribution:
    learnable_action_std: true
    initial_action_std: [0.010, 0.015, 0.015, 0.015]
    minimum_action_std: [0.003, 0.005, 0.005, 0.005]
    maximum_action_std: [0.020, 0.025, 0.025, 0.025]

algorithm:
  name: sac
  gamma: 0.999
  n_step_return: 16
  replay:
    capacity_transitions: 524288
    warmup_transitions: 131072
    batch_size: 4096
  critic_pretraining_updates: 2048
  actor_update_interval: 32
  policy_anchor:
    weight: 30.0
    max_action_deviation: 0.010
  updates_per_collection: 64
  target_update:
    tau: 0.0025
    interval_updates: 1
  entropy:
    automatic: true
    initial_alpha: 0.0002
    target_entropy: -8.0
    min_alpha: 0.00005
    max_alpha: 0.001
  actor_max_grad_norm: 1.0
  critic_max_grad_norm: 2.5
  optimizer:
    type: adam
    actor_learning_rate: 0.0000025
    critic_learning_rate: 0.0002
    alpha_learning_rate: 0.0001

collector:
  control_steps_per_rollout: 256

evaluation:
  enabled: true
  interval_control_steps: 1048576
  suite_path: ../evaluation/fixed_small_command_tracking_v1.yaml
  execution:
    mode: subprocess
    max_in_flight: 1
    pending_policy: latest
    pin_checkpoint: hardlink
    wait_for_final: true
    failure_policy: continue_training

checkpoint:
  minimum_free_space_bytes: 8589934592
  resume:
    from: ../../runs/mlp_sac_attitude_command_tracking_stability_repair_v4/20260803T033036Z_6742833634cf_3a482ed1/checkpoints/step_12582912.pt
    mode: policy
  interval_control_steps: 1048576
  keep_last: 8

recording: {}
