# Small-signal-sensitive direct-command run for the angular-acceleration loop.
#
# v5 proved that the direct command distribution alone is insufficient: its
# full-envelope reward scale still returned about 0.99 around the measured
# zero-command bias. This run keeps the direct distribution but makes sub-1
# rad/s2 errors visible to the critic and actor. Reward semantics remain solely
# angular-acceleration tracking.

schema_version: 2

experiment:
  name: mlp_sac_pid_angular_acceleration_tracking_v6
  entrypoint:
    type: "flight_train.runner:run_experiment"
    version: "train-framework-v1"

seed:
  base: 20260808
  deterministic_algorithms: true
  cudnn_benchmark: false

run:
  device: cuda:0
  dtype: float32
  parallel_count: 512
  # Short falsification budget. Four checkpoints are retained for direct
  # post-training selection; a promising run can be continued exactly.
  total_control_steps: 8388608
  output_root: ../../runs
  allow_unimplemented_simulator: false

environment:
  factory: "simenv:SimulationEnvironment"
  config_path: ../environment/gru_sac_upright_height_only_small_tip.yaml
  observation_source: truth

command_source:
  type: "flight_train.commands:DirectAngularAccelerationCommandSource"
  version: "3"
  seed: 52042
  params:
    throttle:
      minimum: 0.20
      maximum: 0.85
      spool:
        duration_s: 0.10
        target_range: [0.54, 0.58]
      height_controller:
        observation_source: truth
        target_m: 0.0
        initial_throttle_range: [0.55, 0.58]
        proportional_gain: 0.08
        integral_gain: 0.04
        error_limit_m: 5.0
      slew_rate:
        rise_per_s: 4.0
        fall_per_s: 0.35
    # These sticks still provide the external collective/yaw metadata expected
    # by the unchanged environment contract. Their attitude target is not used
    # to generate desired angular acceleration in this training-only source.
    sticks:
      roll:  {mode: angle, limit_rad: 0.0, time_constant_s: 0.20}
      pitch: {mode: angle, limit_rad: 0.0, time_constant_s: 0.20}
      yaw:   {mode: rate, limit_rad_s: 0.0, time_constant_s: 0.30}
      target_sampling:
        distribution: centered
        center_exponent: 2.0
        hold_duration_s:
          range: [2.0, 4.0]
      reset:
        filtered_stick: zero
        initial_target_scale: 0.0
    direct_angular_acceleration:
      limits_rad_s2: [6.0, 6.0, 3.0]
      probabilities: {zero: 0.35, sine: 0.45, balanced_step: 0.20}
      zero:
        hold_duration_s: [1.0, 4.0]
      sine:
        frequency_hz: [0.25, 1.50]
        amplitude_fraction: [0.05, 0.20]
        hold_duration_s: [6.0, 10.0]
      balanced_step:
        cycle_duration_s: [0.8, 1.2]
        amplitude_fraction: [0.10, 1.00]

control_contract:
  version: self_stabilize_v1
  observation_profile: angular_acceleration_allocated_inner_loop_21d_v2
  observation_history:
    mode: uniform
    frames: 61
    stride_steps: 1
  action_transform:
    type: coaxial_differential_cyclic
    lower_motor_upper_ratio: 0.947558738884
    trim_command: [0.535370687470, 0.0, 0.0, 0.0]
    residual_scale: [0.12, 0.40, 0.40]
  policy_action:
    fields: [lower_motor_differential, servo_cyclic_a, servo_cyclic_b]
  external_action:
    fields: [upper_motor]
  simulator_command:
    fields: [upper_motor, lower_motor, servo_1, servo_2, servo_3]

randomization:
  static:
    seed: 32042
    scope: episode
    parameters: {}
  dynamic:
    seed: 42042
    scope: simulator
    parameters: {}

task:
  episode_duration_s: 10.0
  # Retained as the deployment contract and storage location for the direct
  # desired acceleration. The training command source bypasses its update.
  outer_loop:
    type: attitude_pid
    proportional_gain: [18.0, 18.0, 8.0]
    integral_gain: [1.5, 1.5, 0.75]
    derivative_gain: [7.0, 7.0, 4.0]
    integral_limit_rad_s: [0.15, 0.15, 0.20]
    max_angular_acceleration_rad_s2: [6.0, 6.0, 3.0]
  episode_curriculum:
    durations_s:   [4.0, 6.0, 8.0, 10.0]
    target_scales: [0.25, 0.50, 0.75, 1.00]
    success_fraction: 0.80
    evaluation_episodes_per_env: 1.0
    consecutive_passes: 2
    quality_gate:
      max_angular_rate_rms_rad_s: 4.0
  termination:
    max_tilt_rad: 1.0
    max_angular_rate_rad_s: 6.0
    angular_rate_axes: all

reward:
  calculator:
    type: "flight_train.rewards.angular_acceleration:AngularAccelerationTrackingRewardCalculator"
    version: "1"
    params:
      weight: 1.0
      error_scale_rad_s2: [0.75, 0.75, 0.375]
      huber_delta: 1.0
      reward_form: positive_exponential
      aggregation: mean
  context:
    fields:
      - {name: desired_angular_acceleration_b, source: task}
      - {name: actual_angular_acceleration_b, source: task}

model:
  type: mlp_actor_critic
  hidden_sizes: [256, 256]
  policy_distribution:
    learnable_action_std: true
    initial_action_std: [0.05, 0.035, 0.035]
    minimum_action_std: [0.015, 0.010, 0.010]
    maximum_action_std: [0.08, 0.06, 0.06]

algorithm:
  name: sac
  gamma: 0.99
  n_step_return: 8
  replay:
    capacity_transitions: 524288
    warmup_transitions: 131072
    batch_size: 4096
  critic_pretraining_updates: 1024
  actor_update_interval: 8
  policy_anchor:
    weight: 2.0
    max_action_deviation: 0.20
  updates_per_collection: 64
  target_update:
    tau: 0.0025
    interval_updates: 1
  entropy:
    automatic: true
    initial_alpha: 0.0002
    target_entropy: -3.0
    min_alpha: 0.00002
    max_alpha: 0.0008
  actor_max_grad_norm: 0.5
  critic_max_grad_norm: 2.5
  optimizer:
    type: adam
    actor_learning_rate: 0.000005
    critic_learning_rate: 0.0001
    alpha_learning_rate: 0.00005

collector:
  control_steps_per_rollout: 256

# Direct schema-v5 evaluation is run explicitly on every retained checkpoint;
# the current asynchronous best selector is hover-specific.
evaluation:
  enabled: false

checkpoint:
  minimum_free_space_bytes: 8589934592
  resume:
    from: ../../runs/mlp_sac_pid_angular_acceleration_tracking_v3/20260803T073541Z_5923115b3232_cd482fed/checkpoints/step_15728640.pt
    mode: policy
  interval_control_steps: 2097152
  keep_last: 4

recording: {}
