# 512×256 MLP-SAC：从 v4 的低振荡 actor 集中修复稳态低频极限环。
#
# 修复边界：
#   1. policy-only 热启动 step 44040192；新 reward 下重建双 Q、target Q、
#      replay、优化器、alpha 和课程状态，禁止混用 v4 的旧 reward replay。
#   2. 任务固定在该 actor 当时已经掌握的 30s / 50% 指令幅度；单阶段课程
#      从结构上禁止继续晋级到 75% 或 100%。
#   3. 指令保持时间延长到 6~10s，使一次稳态段覆盖多个 0.5~2Hz 摆动周期。
#   4. 加强 roll/pitch 角速度阻尼，并惩罚三舵机 roll/pitch cyclic 模态幅值；
#      不惩罚共同模态，保留必要的偏航/反扭矩配平能力。
#   5. 使用较低探索和弱 policy anchor，保护已有飞行能力，同时允许 actor
#      离开带极限环的旧控制方式。
#
# 启动：
#   flight-train run \
#     --config configs/experiments/mlp_sac_attitude_command_tracking_stability_repair_v1.yaml

schema_version: 2

experiment:
  name: mlp_sac_attitude_command_tracking_stability_repair_v1
  entrypoint:
    type: "flight_train.runner:run_experiment"
    version: "train-framework-v1"

seed:
  base: 20260803
  deterministic_algorithms: true
  cudnn_benchmark: false

run:
  device: cuda:0
  dtype: float32
  parallel_count: 512
  # 96 个 512×256 rollout；先用约 12.6M 步验证修复方向，不盲目长训。
  total_control_steps: 12582912
  output_root: ../../runs
  allow_unimplemented_simulator: false

environment:
  factory: "simenv:SimulationEnvironment"
  config_path: ../environment/gru_sac_upright_height_only_small_tip.yaml
  observation_source: truth

command_source:
  type: "flight_train.commands:VirtualPilotCommandSource"
  version: "2"
  seed: 52033
  params:
    throttle:
      minimum: 0.20
      maximum: 0.85
      spool:
        duration_s: 0.10
        target_range: [0.54, 0.58]
      height_controller:
        observation_source: truth
        target_m: 0.0
        initial_throttle_range: [0.55, 0.58]
        proportional_gain: 0.08
        integral_gain: 0.04
        error_limit_m: 5.0
      slew_rate:
        rise_per_s: 4.0
        fall_per_s: 0.35
    sticks:
      roll:  {mode: angle, limit_rad: 0.10, time_constant_s: 0.20}
      pitch: {mode: angle, limit_rad: 0.10, time_constant_s: 0.20}
      yaw:   {mode: rate, limit_rad_s: 0.35, time_constant_s: 0.30}
      target_sampling:
        distribution: centered
        center_exponent: 2.0
        hold_duration_s:
          range: [6.0, 10.0]
      reset:
        filtered_stick: zero
        initial_target_scale: 0.0

control_contract:
  version: self_stabilize_v1
  observation_profile: attitude_self_stabilize_21d_v3
  observation_history:
    mode: uniform
    frames: 61
    stride_steps: 1
  action_transform:
    type: residual_around_trim
    trim_command: [0.53523, 0.0, 0.0, 0.0]
    residual_scale: [0.30, 1.0, 1.0, 1.0]
  policy_action:
    fields: [lower_motor, servo_1, servo_2, servo_3]
  external_action:
    fields: [upper_motor]
  simulator_command:
    fields: [upper_motor, lower_motor, servo_1, servo_2, servo_3]

randomization:
  static:
    seed: 32033
    scope: episode
    parameters: {}
  dynamic:
    seed: 42033
    scope: simulator
    parameters: {}

task:
  episode_duration_s: 30.0
  episode_curriculum:
    # 单阶段即硬冻结难度；不存在可晋级的下一阶段。
    durations_s: [30.0]
    target_scales: [0.50]
    success_fraction: 0.80
    evaluation_episodes_per_env: 1.0
    consecutive_passes: 2
    quality_gate:
      max_roll_pitch_rmse_rad: 0.04363323129985824
      max_yaw_rate_rmse_rad_s: 0.12
      # 同时要求低角速度，避免只凭平均姿态误差通过质量门槛。
      max_angular_rate_rms_rad_s: 0.20
  termination:
    max_tilt_rad: 1.0
    max_angular_rate_rad_s: 8.0
    angular_rate_axes: roll_pitch

reward:
  calculator:
    type: "flight_train.rewards.attitude:AttitudeRewardCalculator"
    version: "3"
    params:
      roll_pitch_weight: 0.0
      tilt_weight: 0.0
      yaw_rate_weight: 0.0

      # worst-axis 保留非补偿约束；均值辅助项持续给非主导轴梯度，减少
      # roll/pitch 与 yaw 之间的控制权反复切换。
      joint_tracking_weight: 0.004
      joint_tracking_mean_weight: 0.001
      joint_roll_pitch_scale_rad: 0.04363323129985824
      joint_yaw_rate_scale_rad_s: 0.12
      joint_tracking_huber_delta: 1.0

      # v4 的 0.00015625 对稳态周期运动过弱；提高到 0.002，直接阻尼 p/q。
      angular_rate_weight: 0.002
      action_rate_weight: 0.001
      # 只约束三个舵机去共同模态后的 roll/pitch cyclic 控制量。
      servo_cyclic_weight: 0.003
      saturation_weight: 0.01
      alive_bonus: 0.005
      survival_progress_weight: 0.0

      tilt_barrier_weight: 0.01
      rate_barrier_weight: 0.001
      barrier_start_fraction: 0.50
      barrier_exponent: 2.0

      termination_penalty: 10.0
      early_termination_penalty: 10.0
  context:
    fields:
      - {name: attitude_geodesic_rad, source: task}
      - {name: angular_velocity_b, source: truth}
      - {name: static_domain, source: train_randomizer, visibility: reward_only}

model:
  type: mlp_actor_critic
  hidden_sizes: [256, 256]
  policy_distribution:
    learnable_action_std: true
    initial_action_std: [0.020, 0.030, 0.030, 0.030]
    minimum_action_std: [0.005, 0.008, 0.008, 0.008]
    maximum_action_std: [0.035, 0.045, 0.045, 0.045]

algorithm:
  name: sac
  gamma: 0.999
  n_step_return: 16
  replay:
    capacity_transitions: 524288
    warmup_transitions: 131072
    batch_size: 4096
  # 新 critic 先适配新 reward；此阶段 actor 保持 warm-start 行为不动。
  critic_pretraining_updates: 2048
  actor_update_interval: 8
  policy_anchor:
    weight: 2.0
    max_action_deviation: 0.08
  updates_per_collection: 64
  target_update:
    tau: 0.0025
    interval_updates: 1
  entropy:
    automatic: true
    initial_alpha: 0.0008
    target_entropy: -4.0
    min_alpha: 0.0001
    max_alpha: 0.003
  actor_max_grad_norm: 1.0
  critic_max_grad_norm: 2.5
  optimizer:
    type: adam
    actor_learning_rate: 0.000010
    critic_learning_rate: 0.0002
    alpha_learning_rate: 0.0001

collector:
  control_steps_per_rollout: 256

evaluation:
  enabled: true
  # 每 8 个 rollout 评测一次，尽早识别阻尼不足或跟踪能力退化。
  interval_control_steps: 1048576
  suite_path: ../evaluation/fixed_small_command_tracking_v1.yaml
  execution:
    mode: subprocess
    max_in_flight: 1
    pending_policy: latest
    pin_checkpoint: hardlink
    wait_for_final: true
    failure_policy: continue_training

checkpoint:
  minimum_free_space_bytes: 8589934592
  resume:
    from: ../../runs/mlp_sac_attitude_command_tracking_v4/20260731T072003Z_27b0f360c757_96715085/checkpoints/step_44040192.pt
    mode: policy
  interval_control_steps: 1048576
  keep_last: 4

recording: {}
