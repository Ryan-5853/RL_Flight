# 双层 128 单元 GRU-SAC：只训练直立定高，不允许虚拟飞手打杆。
#
# 启动：
#   flight-train run \
#     --config configs/experiments/gru_sac_upright_height_only_small_tip.yaml
#
# 目标姿态恒为单位四元数，目标偏航角速度恒为 0。虚拟飞手只保留上桨的
# 高度 PI 控制器；策略仍控制下桨和三个舵面来抑制初始翻倒趋势。

schema_version: 2

experiment:
  name: gru_sac_upright_height_only_small_tip
  entrypoint:
    type: "flight_train.runner:run_experiment"
    version: "train-framework-v1"

seed:
  base: 20260725
  deterministic_algorithms: true
  cudnn_benchmark: false

run:
  device: cuda:0
  dtype: float32
  parallel_count: 256
  total_control_steps: 16777216
  output_root: ../../runs
  allow_unimplemented_simulator: false

environment:
  factory: "simenv:SimulationEnvironment"
  config_path: ../environment/gru_sac_upright_height_only_small_tip.yaml
  observation_source: truth

command_source:
  type: "flight_train.commands:VirtualPilotCommandSource"
  version: "2"
  seed: 52025
  params:
    throttle:
      minimum: 0.20
      maximum: 0.85
      spool:
        duration_s: 0.10
        target_range: [0.54, 0.58]
      height_controller:
        observation_source: truth
        target_m: 0.0
        initial_throttle_range: [0.55, 0.58]
        proportional_gain: 0.08
        integral_gain: 0.04
        error_limit_m: 5.0
      slew_rate:
        rise_per_s: 4.0
        fall_per_s: 0.35
    # 三轴指令上限严格为 0；target sampling 仍保留是为了满足 version 2
    # 的配置结构，但其输出乘以零上限后始终为零。
    sticks:
      roll:  {mode: angle, limit_rad: 0.0, time_constant_s: 0.20}
      pitch: {mode: angle, limit_rad: 0.0, time_constant_s: 0.20}
      yaw:   {mode: rate, limit_rad_s: 0.0, time_constant_s: 0.30}
      target_sampling:
        distribution: centered
        center_exponent: 2.0
        hold_duration_s:
          range: [2.0, 4.0]
      reset:
        filtered_stick: zero
        initial_target_scale: 0.0

control_contract:
  version: self_stabilize_v1
  observation_profile: attitude_self_stabilize_21d_v3
  action_transform:
    type: residual_around_trim
    trim_command: [0.53523, 0.0, 0.0, 0.0]
    residual_scale: [0.30, 1.0, 1.0, 1.0]
  policy_action:
    fields: [lower_motor, servo_1, servo_2, servo_3]
  external_action:
    fields: [upper_motor]
  simulator_command:
    fields: [upper_motor, lower_motor, servo_1, servo_2, servo_3]

# 机体、执行器和气动参数不随机化。仅环境配置中的初始角速度带有小扰动。
randomization:
  static:
    seed: 32025
    scope: episode
    parameters: {}
  dynamic:
    seed: 42025
    scope: simulator
    parameters: {}

task:
  episode_duration_s: 30.0
  termination:
    max_tilt_rad: 1.0
    max_angular_rate_rad_s: 8.0

reward:
  calculator:
    type: "flight_train.rewards.attitude:AttitudeRewardCalculator"
    version: "3"
    params:
      roll_pitch_weight: 0.1
      tilt_weight: 0.02
      yaw_rate_weight: 0.01
      angular_rate_weight: 0
      action_rate_weight: 0
      saturation_weight: 0
      alive_bonus: 0.02
      survival_progress_weight: 0.0
      tilt_barrier_weight: 0.10
      rate_barrier_weight: 0.005
      barrier_start_fraction: 0.30
      barrier_exponent: 2.0
      termination_penalty: 10.0
      early_termination_penalty: 0.0
  context:
    fields:
      - {name: attitude_geodesic_rad, source: task}
      - {name: angular_velocity_b, source: truth}
      - {name: static_domain, source: train_randomizer, visibility: reward_only}

model:
  type: gru_actor_critic
  encoder:
    hidden_sizes: [128, 128]
  recurrent:
    hidden_sizes: [128, 128]
  actor_head:
    hidden_sizes: [128]
  policy_distribution:
    learnable_action_std: true
    initial_action_std: [0.10, 0.10, 0.10, 0.10]
    minimum_action_std: [0.01, 0.02, 0.02, 0.02]
    maximum_action_std: [0.20, 0.15, 0.15, 0.15]

algorithm:
  name: sac
  gamma: 0.999
  n_step_return: 1
  replay:
    capacity_transitions: 1048576
    warmup_transitions: 65536
    batch_size: 4096
    burn_in_steps: 128
    sequence_length: 128
  critic_pretraining_updates: 0
  # 每轮新增 65,536 步；32 次更新各使用 2,048 个有效训练步，
  # 因而有效训练样本量与新增样本量约为 1:1。
  updates_per_collection: 32
  target_update:
    tau: 0.005
    interval_updates: 1
  entropy:
    automatic: true
    initial_alpha: 0.10
    target_entropy: auto
  actor_max_grad_norm: 1.0
  critic_max_grad_norm: 5.0
  optimizer:
    type: adam
    actor_learning_rate: 0.0003
    critic_learning_rate: 0.0003
    alpha_learning_rate: 0.0003

collector:
  control_steps_per_rollout: 256

evaluation:
  enabled: true
  interval_control_steps: 4194304
  suite_path: ../evaluation/fixed_attitude_v1.yaml

checkpoint:
  resume:
    from: null
    mode: exact
  interval_control_steps: 2097152
  keep_last: 4

recording: {}
