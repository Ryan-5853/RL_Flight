# 标称真值 GRU-SAC 环境。
# 机体、执行器和气动参数复制自 mlp_nominal_baseline_1.yaml；所有显式
# 参数随机化与运行时测量噪声均关闭，便于先验证确定性标称动力学。

schema_version: 1
seed: 20260724

parallel:
  independent_rng: true

timing:
  physics_hz: {value: 500}
  control_hz: {value: 500}

initial_state:
  position_n: {value: [0.0, 0.0, 0.0]}
  velocity_n: {value: [0.0, 0.0, 0.0]}
  attitude_q_wb: {value: [1.0, 0.0, 0.0, 0.0]}
  angular_velocity_b: {value: [0.0, 0.0, 0.0]}

body:
  mass: {value: 1.0}
  center_of_mass_b: {value: [0.0, 0.0, 0.05]}
  inertia_diagonal_b: {value: [0.01, 0.01, 0.02]}

motors:
  - &motor_common
    name: upper
    pwm_deadzone: {value: 0.08}
    pwm_to_rpm_table:
      value: [[0.0, 0.0], [0.08, 0.0], [0.5, 900.0], [1.0, 1800.0]]
    time_constant: {value: 0.030}
    torque_coefficient: {value: 9.8765432e-8}
    noise:
      distribution: normal
      stddev: {value: 0.0}
  - <<: *motor_common
    name: lower
    time_constant: {value: 0.050}
    torque_coefficient: {value: 1.10e-7}

servos:
  - &servo_common
    name: servo_1
    pwm_angle_table:
      value: [[-1.0, -0.35], [0.0, 0.0], [1.0, 0.35]]
    tau: {value: 0.020}
    max_speed: {value: 8.0}
    backlash: {value: 0.010}
    deadzone: {value: 0.015}
  - <<: *servo_common
    name: servo_2
  - <<: *servo_common
    name: servo_3

aerodynamics:
  thrust_coefficients: {value: [4.0e-6, 4.0e-6, -2.0e-6]}
  neutral_thrust_direction_b: {value: [0.0, 0.0, -1.0]}
  direct_thrust_center_b: {value: [0.0, 0.0, 0.20]}
  thrust_partition:
    direct: {value: 0.40}
    grid_1: {value: 0.20}
    grid_2: {value: 0.20}
    grid_3: {value: 0.20}
  grids:
    - &grid_common
      name: grid_1
      aerodynamic_center_b: {value: [0.10, 0.00, 0.25]}
      deflection_axis_b: {value: [1.0, 0.0, 0.0]}
      self_attenuation_curve:
        value: [[0.0, 1.0], [0.35, 0.85]]
      vector_deflection:
        gain: {value: 1.0}
        offset: {value: 0.0}
    - <<: *grid_common
      name: grid_2
      aerodynamic_center_b: {value: [-0.05, 0.087, 0.25]}
      deflection_axis_b: {value: [-0.5, 0.8660254, 0.0]}
    - <<: *grid_common
      name: grid_3
      aerodynamic_center_b: {value: [-0.05, -0.087, 0.25]}
      deflection_axis_b: {value: [-0.5, -0.8660254, 0.0]}
  coupling_attenuation:
    value:
      - [0.0, 0.10, 0.10]
      - [0.10, 0.0, 0.10]
      - [0.10, 0.10, 0.0]

# 训练读取 truth；保留传感器接口但把全部噪声置零，确保环境确定性。
sensors:
  gyro:
    sample_hz: {value: 500}
    noise:
      distribution: normal
      stddev: {value: [0.0, 0.0, 0.0]}
    bias: {value: [0.0, 0.0, 0.0]}
    delay: {value: 0.001}
    interpolation: linear
  accelerometer:
    sample_hz: {value: 500}
    noise:
      distribution: normal
      stddev: {value: [0.0, 0.0, 0.0]}
    bias: {value: [0.0, 0.0, 0.0]}
    delay: {value: 0.001}
    interpolation: linear
  motor_speed:
    sample_hz: {value: 500}
    noise:
      distribution: normal
      stddev: {value: [0.0, 0.0]}
    bias: {value: [0.0, 0.0]}
    delay: {value: 0.0}

logging:
  directory: ../logs
  mode: compact
  physics_step_stride: 20
  fields:
    - physics_step
    - control_step
    - sim_time_s
    - control
    - active_mask
    - valid
    - error_code
    - generation
    - event_code
    - truth.position_n
    - truth.attitude_q_wb
    - truth.angular_velocity_b
    - truth.motor_speed
    - truth.total_thrust
    - truth.servo_angle
  chunk_steps: 64
  queue_chunks: 2
  overflow: block
