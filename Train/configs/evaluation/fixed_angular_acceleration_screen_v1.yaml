schema_version: 5
name: fixed_angular_acceleration_screen_v1

# Fast checkpoint selector for the direct inner loop. The three low-frequency
# traces expose accumulated cross-axis bias; the paired combined steps reject a
# policy that improves small-signal drift by discarding large-signal authority.
seed: 82005
parallel_count: 4
output_root: ../../evaluation_runs

scenarios:
  - {name: xyz_step_25, type: angular_acceleration_step, duration_s: 2.0, angular_acceleration_amplitude_rad_s2: [1.5, 1.5, 0.75]}
  - {name: xyz_step_100, type: angular_acceleration_step, duration_s: 2.0, angular_acceleration_amplitude_rad_s2: [6.0, 6.0, 3.0]}
  - {name: x_sine_0_25_hz, type: angular_acceleration_sine, duration_s: 10.0, angular_acceleration_amplitude_rad_s2: [0.3, 0.0, 0.0], frequency_hz: 0.25}
  - {name: y_sine_0_25_hz, type: angular_acceleration_sine, duration_s: 10.0, angular_acceleration_amplitude_rad_s2: [0.0, 0.3, 0.0], frequency_hz: 0.25}
  - {name: z_sine_0_25_hz, type: angular_acceleration_sine, duration_s: 10.0, angular_acceleration_amplitude_rad_s2: [0.0, 0.0, 0.15], frequency_hz: 0.25}

scoring:
  limits:
    attitude_rmse_bad_deg: 10.0
    yaw_rate_rmse_bad_rad_s: 0.35
    position_rmse_bad_m: 5.0
    velocity_rmse_bad_m_s: 3.0
    action_rms_bad: 1.0
    action_delta_rms_bad: 0.25
    saturation_fraction_bad: 0.50
    response_time_bad_s: 0.50
    settling_error_deg: 2.0
    settling_window_s: 0.02
    phase_lag_max_s: 0.50
  weights:
    survival: 0.15
    tracking: 0.55
    action: 0.10
    response: 0.20
