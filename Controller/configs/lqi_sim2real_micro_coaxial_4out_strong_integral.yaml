type: lqr
# Strong-integral variant of lqi_sim2real_micro_coaxial_4out.yaml.
# Used only for offline gain synthesis against the identified composite
# coefficients (Identification/scripts/evaluate_real_log_hybrid.py); the
# deployment/nominal 13-state model still uses the original 4out config.
# integral_state_scales are halved (=> 4x integral Q weight), which roughly
# doubles the roll/pitch/yaw integral gains to remove steady-state error.
params:
  # Deployment contract: the upper rotor is owned by the pilot (virtual pilot
  # height PI during training); the LQR controls only lower_motor + servo_1/2/3.
  collective_mode: external_upper
  virtual_pilot:
    throttle:
      minimum: 0.20
      maximum: 0.96
      # Nominal hover throttle at 0.5 kg with the measured thrust curve.
      initial: 0.30
      spool_duration_s: 0.10
    height_controller:
      mode: pid
      target_m: 0.0
      # Competent-pilot altitude hold: throttle-domain PID with velocity damping.
      proportional_gain: 0.10
      integral_gain: 0.20
      derivative_gain: 0.08
      integral_limit: 1.0
      error_limit_m: 5.0
  pid:
    altitude:
      kp: 4.0
      ki: 0.8
      kd: 3.2
      integral_limit: 2.0
      minimum_thrust_fraction: 0.20
      maximum_thrust_fraction: 0.96
    attitude:
      roll_pitch_natural_frequency_rad_s: 6.0
      yaw_rate_bandwidth_rad_s: 5.0
      damping_ratio: 0.85
      integral_fraction: [0.08, 0.08, 0.04]
      integral_limit: [0.30, 0.30, 0.60]
      maximum_moment_n_m: [0.08, 0.08, 0.04]
  lqr:
    state_scales: [0.0872665, 0.0872665, 1.0, 1.0, 2.0, 300.0, 300.0, 0.15, 0.15, 0.15]
    # 4x integral weight relative to the nominal 4out config ([0.04, 0.04, 0.25]).
    integral_state_scales: [0.02, 0.02, 0.125]
    # Four controlled inputs: lower_motor, servo_1, servo_2, servo_3.
    input_scales: [0.16, 0.40, 0.40, 0.40]
    input_weight_scale: 0.08
  allocation:
    input_weights: [1.5, 1.5, 1.0, 1.0, 1.0]
    damping: 1.0e-5
